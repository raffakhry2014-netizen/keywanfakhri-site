name: IndexNow
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Cloudflare Pages deploy
        run: sleep 120
      - name: Submit URLs to IndexNow
        run: python3 scripts/indexnow.py
