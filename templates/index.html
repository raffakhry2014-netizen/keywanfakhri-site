:root{--accent:#087e7c;--accent-d:#066562;--ink:#162d2e;--muted:#5b6b6c;--line:#dce5e4;--pale:#eef7f5;--night:#0b1a26;--sand:#f5a25f}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'DM Sans',Arial,sans-serif;color:var(--ink);background:#fff;-webkit-text-size-adjust:100%}
html[dir=rtl] body{font-family:'Vazirmatn','DM Sans',Arial,sans-serif}
a{color:inherit;text-underline-offset:4px}
a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.wrap{max-width:1240px;margin:0 auto;padding:0 40px}
header.top{border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:88px;flex-wrap:wrap}
.brand{position:relative;display:block;flex:none;width:172px;height:56px;overflow:hidden;direction:ltr}
.brand img{position:absolute;width:272px;height:auto;max-width:none;left:-48px;top:-41px}
.nav{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.nav a{text-decoration:none;font-size:15px;padding:8px 0}
.nav a:hover{color:var(--accent)}
.nav select{border:1px solid var(--line);background:#fff;border-radius:6px;padding:9px 10px;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.hero{padding:64px 0 36px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.6px;color:var(--accent);margin:0 0 18px}
html[dir=rtl] .eyebrow{letter-spacing:0}
h1{font-family:Manrope,'DM Sans',Arial,sans-serif;font-size:clamp(32px,4.2vw,54px);font-weight:600;line-height:1.12;letter-spacing:-1.6px;margin:0;max-width:820px}
html[dir=rtl] h1,html[dir=rtl] h2{font-family:'Vazirmatn',Arial,sans-serif;letter-spacing:0}
.lead{font-size:18px;line-height:1.75;color:var(--muted);max-width:640px;margin:20px 0 0}
.tpl{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:56px;align-items:start;padding:28px 0 64px}
.shot{margin:0}
.shot a{display:block;border-radius:16px;overflow:hidden;line-height:0;box-shadow:0 40px 80px -40px rgba(11,26,38,.6),0 0 0 1px rgba(11,26,38,.1)}
.shot img{display:block;width:100%;height:auto}
.side{position:sticky;top:24px}
.tpl+.tpl{border-top:1px solid var(--line);padding-top:56px}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:1.2px;color:var(--accent-d);background:var(--pale);border:1px solid #cfe5e0;border-radius:999px;padding:6px 12px;direction:ltr}
h2{font-family:Manrope,'DM Sans',Arial,sans-serif;font-size:clamp(28px,3vw,38px);font-weight:600;letter-spacing:-1px;margin:18px 0 4px;direction:ltr;text-align:start}
html[dir=rtl] h2{text-align:right}
.sub{font-size:17px;font-weight:600;color:var(--accent-d);margin:0 0 16px}
.text{font-size:16.5px;line-height:1.75;color:var(--muted);margin:0 0 22px}
.feats{list-style:none;margin:0 0 22px;padding:0;display:grid;gap:12px}
.feats li{display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.55}
.feats svg{flex:none;width:22px;height:22px;margin-top:1px}
.req{font-size:13.5px;color:var(--muted);margin:0 0 26px;padding-top:18px;border-top:1px solid var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:50px;padding:0 22px;border-radius:8px;font-weight:700;font-size:15.5px;text-decoration:none;border:1.5px solid var(--accent);transition:background .15s,color .15s}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-d);border-color:var(--accent-d)}
.btn.ghost{color:var(--accent-d);background:#fff}
.btn.ghost:hover{background:var(--pale)}
.btn svg{width:20px;height:20px}
.size{display:block;font-size:12.5px;color:var(--muted);margin-top:10px;direction:ltr;text-align:start}
html[dir=rtl] .size{text-align:right}
.how{padding:52px 0;border-top:1px solid var(--line)}
.how h3{font-family:Manrope,'DM Sans',Arial,sans-serif;font-size:24px;font-weight:600;margin:0 0 26px}
html[dir=rtl] .how h3{font-family:'Vazirmatn',Arial,sans-serif}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;counter-reset:s}
.steps li{counter-increment:s;background:var(--pale);border:1px solid #d6ebe6;border-radius:12px;padding:22px 22px 24px;font-size:15.5px;line-height:1.6}
.steps li:before{content:counter(s,decimal-leading-zero);display:block;font-family:Manrope,Arial,sans-serif;font-weight:700;font-size:13px;letter-spacing:1px;color:var(--accent);margin-bottom:10px}
.fine{font-size:13.5px;line-height:1.7;color:var(--muted);margin:28px 0 0;max-width:820px}
.more{font-size:14px;font-weight:600;color:var(--accent-d);margin:10px 0 0}
.morelink{display:inline-block;margin-top:14px;font-weight:700;color:var(--accent-d);text-decoration:none}.morelink:hover{text-decoration:underline}
.guide{margin:18px 0 0}.guide a{font-weight:700;color:var(--accent-d)}
footer.foot{border-top:1px solid var(--line);padding:26px 0 18px;font-size:13.5px;color:var(--muted)}
footer.foot .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (max-width:900px){
 .wrap{padding:0 16px}
 .tpl{grid-template-columns:1fr;gap:32px}
 .side{position:static}
 .steps{grid-template-columns:1fr}
 .hero{padding:40px 0 20px}
 header.top .wrap{min-height:72px;padding-top:8px;padding-bottom:8px}
 .nav{gap:14px}
}
@media (max-width:520px){.nav a{font-size:14px}.btn{width:100%;justify-content:center}}
</style>
