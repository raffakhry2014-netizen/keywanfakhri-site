const NAMES=[['de','Deutsch'],['en','English'],['fa','فارسی'],['ar','العربية'],['tr','Türkçe'],['it','Italiano'],['fr','Français'],['ko','한국어'],['zh','中文（简体）'],['ja','日本語'],['es','Español'],['sq','Shqip']];
const CHECK='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#eef7f5" stroke="#9fd3c9"/><path d="m7.5 12.3 3 3 6-6.3" stroke="#087e7c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let stored;try{stored=localStorage.getItem('keyone-language')}catch(e){}
let lang=new URLSearchParams(location.search).get('lang')||stored||'de';
if(!I18N[lang])lang='de';
const sel=document.getElementById('lang');
sel.innerHTML=NAMES.map(([c,n])=>`<option value="${c}">${n}</option>`).join('');
let sheet='dash';
const SIZES={dash:[1327,2240],orders:[1400,589],settings:[1400,976],guide:[1400,1055]};
function showSheet(k){sheet=k;const img=`/templates/img/${k}-${lang}.jpg`,el=document.getElementById('shot');el.src=img;el.width=SIZES[k][0];el.height=SIZES[k][1];document.getElementById('shot-link').href=img;
 document.querySelectorAll('#sheet-tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.sheet===k)));}
document.getElementById('sheet-tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)showSheet(b.dataset.sheet)});
function render(){
 const t=I18N[lang];
 document.documentElement.lang=lang;
 document.documentElement.dir=['fa','ar'].includes(lang)?'rtl':'ltr';
 document.title=t.doc;
 document.querySelector('meta[name=description]').content=t.desc;
 document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t[el.dataset.t]);
 document.getElementById('feats').innerHTML=t.f.map(x=>`<li>${CHECK}<span>${esc(x)}</span></li>`).join('');
 document.getElementById('steps').innerHTML=t.s.map(x=>`<li>${esc(x)}</li>`).join('');
 showSheet(sheet);document.getElementById('shot').alt=t.alt;
 const q='?lang='+lang;
 document.getElementById('home-link').href='/'+q;
 document.getElementById('nav-projects').href='/'+q+'#projects';
 document.getElementById('nav-about').href='/about/'+q;
 document.getElementById('nav-contact').href='/contact/'+q;
 document.getElementById('custom').href='/contact/'+q;
 sel.value=lang;sel.setAttribute('aria-label',t.lang);
 try{localStorage.setItem('keyone-language',lang)}catch(e){}
}
sel.addEventListener('change',()=>{lang=sel.value;try{const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u)}catch(e){}render()});
render();
