 try{const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode($('pw').value),'PBKDF2',false,['deriveKey']);
  K=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(SALT),iterations:IT,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  await dec(d(CHK).buffer);show()}catch(x){K=null;e.textContent=UI[LG].wrong}};
function show(){$('box').style.maxWidth='1000px';$('f').style.display='none';$('files').style.display='block';renderList()}
function renderList(){const L=$('list');L.innerHTML='';const u=UI[LG];
 ITEMS.forEach(it=>{const r=document.createElement('div');r.className='it';
  r.innerHTML=`<div class="i">${ICON[it.kind]}</div><div class="t"><b>${it.label[LG]}</b><p class="dsc">${it.desc[LG]}</p><span>${it.name} · ${it.size}</span></div>`;
  if(it.kind==='model'){const b=document.createElement('button');b.textContent=u.open;b.className='s';b.onclick=()=>run(it,b,'open');r.appendChild(b)}
  else{if(it.kind==='video'){const p=document.createElement('button');p.textContent=u.play;p.className='s';p.onclick=()=>run(it,p,'play');r.appendChild(p)}
   const b=document.createElement('button');b.textContent=u.dl;b.onclick=()=>run(it,b,'dl');r.appendChild(b)}
  L.appendChild(r)})}
const cache={};
$('back').onclick=()=>{$('ov').style.display='none';document.body.style.overflow=''};
async function get(it){if(cache[it.bin])return cache[it.bin];const r=await fetch(it.bin,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return cache[it.bin]=await dec(await r.arrayBuffer())}
async function run(it,btn,mode){const t=btn.textContent;btn.textContent='…';$('e2').textContent='';
 try{const buf=await get(it);
  if(mode==='open'){window._mu=window._mu||{};const mu=window._mu[it.bin]||(window._mu[it.bin]=URL.createObjectURL(new Blob([buf],{type:'text/html'})));const f=$('ovf');if(f.src!==mu){f.onload=()=>setTimeout(()=>{try{f.contentWindow.postMessage({cockpitLangOuter:LG},'*')}catch(e){}},300);f.src=mu}
   $('ov').style.display='block';document.body.style.overflow='hidden';btn.textContent=t;try{f.contentWindow.postMessage({cockpitLangOuter:LG},'*')}catch(e){}return}
  const type={video:'video/mp4',pdf:'application/pdf',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}[it.kind];
  const url=URL.createObjectURL(new Blob([buf],{type}));
  if(mode==='play'){const v=$('vid');v.src=url;v.style.display='block';v.play()}
  else{const a=document.createElement('a');a.href=url;a.download=it.name;document.body.appendChild(a);a.click();a.remove()}
 }catch(x){$('e2').textContent=UI[LG].err+' ('+x.message+')'}btn.textContent=t}

video:{k:['video','ویدیو','فیلم','tour'],de:'Das <em>Video</em> (1 Minute) zeigt eine Tour durch die Höhen-Modelle und die Frontansicht einer Zeile – gut für einen schnellen Überblick oder zum Weiterleiten. „Abspielen“ startet es hier, „Download“ speichert die MP4-Datei.',en:'The <em>video</em> (1 minute) shows a tour through the height models and the front view of a row – good for a quick overview or forwarding. “Abspielen” plays it here, “Download” saves the MP4.',fa:'<em>ویدیو</em> (یک دقیقه) توری در مدل‌های ارتفاعی و نمای روبه‌روی یک ردیف است؛ برای دیدن سریع یا فرستادن برای دیگران. «Abspielen» همین‌جا پخشش می‌کند و «Download» فایل MP4 را ذخیره می‌کند.'},
pdf:{k:['pdf','druck','print','چاپ'],de:'Das <em>PDF</em> ist zum Ausdrucken oder für Besprechungen: Tabelle der 10 Höhen-Modelle (maximale Palettenhöhe je Ebene) und Bilder der wichtigsten 3D-Ansichten.',en:'The <em>PDF</em> is for printing or meetings: table of the 10 height models (max. pallet height per level) and images of the main 3D views.',fa:'<em>PDF</em> برای چاپ یا جلسه است: جدول ۱۰ مدل ارتفاعی (حداکثر ارتفاع پالت در هر طبقه) و عکس نماهای اصلی سه‌بعدی.'},

safe:{k:['sicher','passwort','vertraul','safe','secur','password','امن','رمز','محرمانه'],de:'Die Seite ist passwortgeschützt und alle Dateien sind verschlüsselt – ohne Passwort sind sie nicht lesbar. Die Seite ist nirgends verlinkt und wird von Suchmaschinen nicht gefunden. Bitte Link und Passwort nicht weitergeben.',en:'The page is password-protected and all files are encrypted – without the password they cannot be read. The page is not linked anywhere and is not found by search engines. Please do not share link and password.',fa:'صفحه رمزدار است و همه‌ی فایل‌ها رمزنگاری شده‌اند – بدون رمز خوانده نمی‌شوند. صفحه جایی لینک نشده و موتورهای جستجو آن را پیدا نمی‌کنند. لطفاً لینک و رمز را به کسی ندهید.'},
open:{k:['offnen','öffnen','geht nicht','funktion','problem','browser','open','not work','باز','کار نمی'],de:'Am besten mit Chrome oder Edge am PC öffnen. Wenn etwas nicht lädt: Strg+F5 drücken. Das 3D-Modell braucht ein paar Sekunden. Downloads landen im Download-Ordner.',en:'Best opened with Chrome or Edge on a PC. If something does not load: press Ctrl+F5. The 3D model needs a few seconds. Downloads go to the downloads folder.',fa:'بهتر است با Chrome یا Edge روی کامپیوتر باز شود. اگر چیزی بالا نیامد Ctrl+F5 بزنید. مدل سه‌بعدی چند ثانیه طول می‌کشد. دانلودها در پوشه‌ی Downloads ذخیره می‌شوند.'},

function male(lg){const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];const own=vs.filter(v=>v.lang&&v.lang.toLowerCase().startsWith(lg));const M=/(male|mann|stefan|conrad|killian|florian|ralf|markus|hans|michael|karsten|jonas|bernd|david|guy|christopher|eric|roger|brian|ryan|george|farid|amir|daniel|thomas|james|andrew|mark|richard|davis|tony|jason)/i;const nat=v=>/natural|online/i.test(v.name)?0:1;const ms=own.filter(v=>M.test(v.name)&&!/female/i.test(v.name)).sort((a,b)=>nat(a)-nat(b));let v=ms[0]||null;window.__vm=!!v;if(!v)v=own.find(x=>/^microsoft/i.test(x.name))||own[0]||null;return v}
