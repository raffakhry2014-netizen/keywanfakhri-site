<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#173F32" />
<title>Bella Vista – Caffè &amp; Ristorante · Gastlyo Demo</title>
<meta name="description" content="Demo: digitale Speisekarte mit KI-Kellner KIWA für ein italienisches Café – in 12 Sprachen. Fiktives Lokal." />
<link rel="preload" href="/gastlyo/fonts/karla-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />

<style>
/* Self-hosted fonts (no Google Fonts request) */
@font-face{font-family:'Karla';font-style:normal;font-weight:200 800;font-display:swap;src:url('/gastlyo/fonts/karla-latin-ext-wght-normal.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Karla';font-style:normal;font-weight:200 800;font-display:swap;src:url('/gastlyo/fonts/karla-latin-wght-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Playfair Display SC';font-style:normal;font-weight:700;font-display:swap;src:url('/gastlyo/fonts/playfair-display-sc-latin-ext-700-normal.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Playfair Display SC';font-style:normal;font-weight:700;font-display:swap;src:url('/gastlyo/fonts/playfair-display-sc-latin-700-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  --green:#173F32; --green-2:#24503F; --green-3:#0F2C23;
  --bg:#FAF8F5; --surface:#FFFFFF; --line:#ECE7DF; --line-2:#E4DED4;
  --ink:#1C1B19; --muted:#6B665E; --soft:#CFDDD6;
  --amber-bg:#F6E8DA; --amber-ink:#8A4512; --mint:#E3EEE8; --badge:#B4501A;
  --radius:18px; --nav-h:68px;
  --display:"Playfair Display SC",Georgia,"Times New Roman",serif;
  --body:"Karla",system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans","Apple SD Gothic Neo","Malgun Gothic","PingFang SC","Microsoft YaHei","Hiragino Sans","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom))}
html[lang="fa"] body,html[lang="ar"] body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid rgba(23,63,50,.45);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{width:min(1120px,100%);margin:0 auto;padding:0 20px}
.no-scrollbar{scrollbar-width:none}.no-scrollbar::-webkit-scrollbar{display:none}
[hidden]{display:none!important}

/* demo note + top bar */
.demo-note{background:var(--amber-bg);color:var(--amber-ink);font-size:12.5px;font-weight:600;text-align:center;padding:7px 16px;line-height:1.4}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:10px}
.wordmark{font-family:var(--display);font-size:24px;color:var(--green);letter-spacing:.2px;text-decoration:none;line-height:1}
.lang-btn{display:flex;align-items:center;gap:6px;height:42px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:13px}
.lang-btn svg{width:18px;height:18px}

/* buttons */
.icon-btn{width:40px;height:40px;flex:0 0 40px;border-radius:50%;border:0;background:var(--green);color:#fff;display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}
.icon-btn:disabled{background:#B9B3A9;cursor:not-allowed}
.btn-primary{height:54px;border:0;border-radius:16px;background:var(--green);color:#fff;font-weight:700;font-size:16px;padding:0 20px}
.btn-primary:hover{background:var(--green-3)}
.btn-primary:disabled{background:#B9B3A9;cursor:not-allowed}
.link-btn{border:0;background:none;color:var(--green);font-weight:700;font-size:14px;padding:8px 0}
.chip{flex:0 0 auto;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.chip-row{display:flex;gap:8px;overflow-x:auto}

/* hero */
.hero{background:var(--green);color:#F4EFE6;border-radius:24px;padding:22px 20px 20px;margin-top:4px}
.hero-tagline{font-size:13px;color:var(--soft);margin:0}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,6vw,44px);line-height:1.08;color:#fff;margin:4px 0 0}
.kiwa-row{display:flex;gap:12px;align-items:flex-start;margin-top:18px}
.avatar{flex:0 0 44px;width:44px;height:44px;border-radius:50%;background:var(--amber-bg);color:var(--green);display:grid;place-items:center}
.avatar svg{width:22px;height:22px}
.bubble-dark{background:var(--green-2);border-radius:16px;padding:12px 14px;font-size:14.5px;line-height:1.5;margin:0}
.ask-form{display:flex;align-items:center;gap:6px;margin-top:14px;background:var(--surface);border-radius:16px;padding:5px 5px 5px 16px;padding-inline:16px 5px}
.ask-form input{flex:1;min-width:0;border:0;outline:0;background:transparent;height:44px;font-size:15px;color:var(--ink)}
.ask-form input::placeholder{color:var(--muted)}
.home-chips{padding-top:16px}

/* sections */
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px}
.section-head h2{margin:0;font-size:19px;font-weight:800}
.page-title{font-family:var(--display);font-weight:700;font-size:30px;color:var(--green);margin:4px 0 14px;line-height:1.1}

/* featured cards */
.featured{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;margin:0 -20px;padding-inline:20px}
.fcard{flex:0 0 176px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.fcard .open{border:0;background:none;padding:0;text-align:start;display:block;width:100%}
.fcard img{width:100%;height:132px;object-fit:cover;background:var(--line)}
.fcard .txt{padding:10px 12px 4px}
.fcard .name{font-weight:800;font-size:15px;line-height:1.25}
.fcard .desc{margin-top:4px;font-size:12.5px;line-height:1.4;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fcard .foot{display:flex;align-items:center;justify-content:space-between;padding:6px 12px 12px;margin-top:auto}
.price{font-weight:800;white-space:nowrap}

/* category tiles */
.cat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cat-tile{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:0;overflow:hidden;text-align:start}
.cat-tile img{width:100%;height:96px;object-fit:cover;background:var(--line)}
.cat-tile span{display:block;padding:9px 12px 11px;font-weight:800;font-size:14px}
@media(min-width:700px){.cat-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1000px){.cat-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}

/* menu */
.search{display:flex;align-items:center;gap:10px;height:50px;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:0 14px;color:var(--muted)}
.search svg{width:18px;height:18px;flex:0 0 18px}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:15px}
.menu-chips{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 20px;margin:0 -20px}
.cat-title{font-size:19px;font-weight:800;margin:22px 0 10px}
.dish-list{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:760px){.dish-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1060px){.dish-list{grid-template-columns:repeat(3,minmax(0,1fr))}}
.row{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;display:flex;align-items:center;gap:12px}
.row .open{flex:1;min-width:0;border:0;background:none;padding:0;display:flex;gap:12px;align-items:center;text-align:start}
.row img{flex:0 0 88px;width:88px;height:88px;border-radius:12px;object-fit:cover;background:var(--line)}
.row .name{font-weight:800;font-size:15px;line-height:1.3}
.row .desc{margin-top:3px;font-size:13px;line-height:1.4;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .meta{margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.sold{opacity:.6}
.pill{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--mint);color:var(--green);white-space:nowrap}
.pill.warm{background:var(--amber-bg);color:var(--amber-ink)}
.pill.dark{background:var(--ink);color:#fff}
.status{margin:14px 0;border-radius:14px;padding:12px 14px;font-size:14px;background:var(--surface);border:1px solid var(--line-2);color:var(--muted)}
.status.error{background:#FBEAEA;border-color:#EBC3C3;color:#8A1F1F}

/* chat */
.chat-head{display:flex;align-items:center;gap:12px;padding:4px 0 14px;border-bottom:1px solid var(--line)}
.chat-head .avatar{background:var(--green);color:var(--amber-bg)}
.chat-head strong{display:block;font-size:18px}
.chat-head span{font-size:13px;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:12px;padding:18px 0;max-width:720px}
.chat>*{scroll-margin-bottom:190px}
.msg{max-width:86%;padding:12px 14px;border-radius:18px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;margin:0}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-start-start-radius:6px}
.msg.user{align-self:flex-end;background:var(--green);color:#fff;border-start-end-radius:6px}
.chat-dishes{display:flex;flex-direction:column;gap:8px;align-self:stretch}
.chat-dishes .row img{flex-basis:64px;width:64px;height:64px}
.typing{display:inline-flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:#B9B3A9;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.chat-input{position:sticky;bottom:calc(var(--nav-h) + 8px + env(safe-area-inset-bottom));background:var(--bg);padding:10px 0 4px;max-width:720px}
.chat-input .ask-form{border:1px solid var(--line-2);margin-top:8px}

/* order */
.order-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.table-field{display:flex;align-items:center;gap:6px;background:var(--mint);color:var(--green);border-radius:999px;padding:0 6px 0 14px;padding-inline:14px 6px;height:40px;font-weight:800;font-size:14px}
.table-field input{width:48px;height:30px;border:0;border-radius:999px;text-align:center;background:var(--surface);font-weight:800;color:var(--green)}
.cart{display:flex;flex-direction:column;gap:10px;max-width:720px}
.stepper{display:flex;align-items:center;gap:2px;border:1px solid var(--line-2);border-radius:999px;padding:2px;background:var(--surface)}
.stepper button{width:36px;height:36px;border:0;border-radius:50%;background:none;display:grid;place-items:center}
.stepper button svg{width:16px;height:16px}
.stepper span{min-width:20px;text-align:center;font-weight:800}
.note{width:100%;height:50px;border:1px solid var(--line-2);border-radius:14px;background:var(--surface);padding:0 14px;font-size:14.5px;outline:0}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 14px}
.total span{color:var(--muted)}.total strong{font-size:22px}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--mint);color:var(--green);border-radius:16px;padding:14px 16px;font-weight:700;font-size:14px;margin-bottom:14px}
.notice svg{width:20px;height:20px;flex:0 0 20px;margin-top:1px}
.order-wrap{max-width:720px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed #DCD5CA;border-radius:var(--radius)}

/* sheets */
.overlay{position:fixed;inset:0;background:rgba(28,27,25,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:min(560px,100%);max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;position:relative;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:24px;max-height:88vh}}
.sheet-close{position:absolute;top:14px;inset-inline-end:14px;width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;z-index:2;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.sheet-close svg{width:20px;height:20px}
.dish-img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--line)}
.dish-body{padding:20px 20px 24px}
.dish-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.dish-top h2{margin:0;font-size:24px;line-height:1.2;font-weight:800}
.dish-top .price{font-size:20px}
.dish-desc{margin:8px 0 0;color:var(--muted);font-size:15px;line-height:1.55}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stat strong{display:block;font-size:16px}
.stat span{font-size:11.5px;color:var(--muted)}
.label{margin-top:18px;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.label-text{margin:6px 0 0;font-size:14.5px}
.al-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.al-chips span{font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface)}
.hint{margin-top:14px;font-size:12.5px;color:var(--muted);line-height:1.45}
.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pair{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:0;overflow:hidden;text-align:start}
.pair img{width:100%;height:92px;object-fit:cover;background:var(--line)}
.pair div{padding:8px 10px 10px;font-size:13px}
.pair strong{display:block}
.pair span{color:var(--muted)}
.add-bar{display:flex;gap:12px;align-items:center;margin-top:22px}
.add-bar .stepper{height:54px;padding:0 6px;border-radius:16px}
.add-bar .btn-primary{flex:1}
.lang-list{padding:20px 14px 18px}
.lang-list h2{margin:4px 8px 12px;font-size:18px}
.lang-item{width:100%;height:50px;border:0;border-radius:14px;background:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:16px;font-weight:700;text-align:start}
.lang-item small{color:var(--muted);font-size:12px;font-weight:700}
.lang-item[aria-current="true"]{background:var(--mint);color:var(--green)}

/* bottom nav */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav .inner{width:min(560px,100%);margin:0 auto;height:var(--nav-h);display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.nav-btn{border:0;background:none;color:#8A857C;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700;min-width:0;padding:0 2px}
.nav-btn svg{width:22px;height:22px}
.nav-btn>span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-btn[aria-current="page"]{color:var(--green)}
.nav-ico{position:relative;display:flex}
.badge{position:absolute;top:-6px;inset-inline-end:-10px;min-width:18px;height:18px;border-radius:9px;background:var(--badge);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));z-index:70;width:min(520px,calc(100% - 32px));background:var(--ink);color:#fff;border-radius:16px;padding:13px 16px;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast svg{width:20px;height:20px;flex:0 0 20px}

.legal-footer{text-align:center;padding:36px 16px 8px;font-size:13px;color:var(--muted)}
.legal-footer a{color:inherit;margin:0 8px;text-decoration:none}
.legal-footer a:hover{text-decoration:underline}
@media(min-width:900px){.home-grid{display:grid;grid-template-columns:minmax(0,1fr);}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* café demo: icon tiles instead of photos */
.tile{display:grid;place-items:center;background:var(--t-bg,#F6E8DA);color:var(--t-ink,#8A4512)}
.tile svg{width:42%;height:42%;max-width:56px;max-height:56px}
.t-food{--t-bg:#F6E8DA;--t-ink:#8A4512}
.t-coffee{--t-bg:#EFE4D8;--t-ink:#5B3A1E}
.t-soft{--t-bg:#E3EEE8;--t-ink:#173F32}
.t-bar{--t-bg:#F4E1E4;--t-ink:#7A2335}
.fcard .tile{width:100%;height:120px}
.row .tile{flex:0 0 64px;width:64px;height:64px;border-radius:14px}
.row .tile svg{width:30px;height:30px}
.cat-tile .tile{width:100%;height:84px}
.cat-tile .tile svg{width:34px;height:34px}
.pair .tile{width:100%;height:72px}
.pair .tile svg{width:28px;height:28px}
.dish-hero{width:100%;height:150px;border-radius:24px 24px 0 0}
.dish-hero svg{width:72px;height:72px}
.special{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-top:4px}
.special .tile{flex:0 0 76px;width:76px;height:76px;border-radius:16px}
.special .tile svg{width:34px;height:34px}
.special .open{flex:1;min-width:0;border:0;background:none;padding:0;display:flex;gap:14px;align-items:center;text-align:start}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--amber-ink)}
.cat-note{margin:-4px 0 10px;font-size:13px;color:var(--muted)}
.size{font-size:12.5px;color:var(--muted)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" role="note"></div>

<header class="wrap topbar">
  <a class="wordmark" href="#" data-go="home">Bella Vista</a>
  <button type="button" class="lang-btn" id="langBtn" aria-haspopup="dialog">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/></svg>
    <span id="langCode">DE</span>
  </button>
</header>

<main class="wrap">
  <!-- HOME -->
  <section id="view-home" data-view="home">
    <div class="hero">
      <p class="hero-tagline">Caffè &amp; Ristorante</p>

function stripEmoji(s){return String(s||"").replace(/^[^\p{L}\p{N}]+/u,"").trim()}
function money(n){try{return new Intl.NumberFormat(LOCALE[lang]||"de-DE",{style:"currency",currency:"EUR"}).format(Number(n)||0)}catch{return (Number(n)||0).toFixed(2)+" €"}}
function priceOf(item,mult=1){const p=money(item.price*mult);return item.from&&mult===1?fromPrice(p):p}
function sessionId(){let id=sessionStorage.getItem("gastlyo_analytics_session");if(!id){id=(crypto.randomUUID?crypto.randomUUID():String(Date.now()));save(sessionStorage,"gastlyo_analytics_session",id)}return id}

/* ---- translation ---- */
const CI=window.CAFFE_I18N||{categories:{},notes:{},names:{},terms:{},pieces:{}};
function nameOf(i){return lang==="de"?i.name:(CI.names[i.name]?.[lang]||i.name)}
function sep(){return ["fa","ar"].includes(lang)?"، ":(["zh","ja"].includes(lang)?"、":", ")}
function descOf(i){const d=i.d||[];if(!d.length)return "";return d.map(t=>lang==="de"?t:(CI.terms[t]?.[lang]||t)).join(sep())}
function sizeOf(i){if(!i.size)return "";let s=i.size;if(lang!=="de"){s=s.replace("Stück",CI.pieces[lang]||"pcs");if(["en","ko","zh","ja"].includes(lang))s=s.replace(/(\d),(\d)/g,"$1.$2")}return s}
function catLabel(c){return CI.categories[c]?.[lang]||({special:"Gericht der Woche",breakfast:"Frühstück",antipasti:"Antipasti",salads:"Salate & Beilagen",pasta:"Pasta",focaccia:"Focaccia",pizza:"Pizza",hot:"Kaffee & warme Getränke",cold:"Kalte Getränke",aperitivo:"Aperitivo",cocktails:"Cocktails",mocktails:"Alkoholfreie Cocktails",wine_beer:"Wein & Bier",digestivo:"Digestivi & Gin"})[c]||c}
function catNote(c,notes){if(!notes||!notes[c])return "";return lang==="de"?notes[c]:(CI.notes[c]?.[lang]||notes[c])}
function tagsOf(i){
  const tg=UI().tags||{},out=[];
  if(i.vegan)out.push([tg.vegan,""]);else if(i.veg&&!["hot","cold","aperitivo","cocktails","mocktails","wine_beer","digestivo"].includes(i.cat))out.push([tg.vegetarian,""]);
  if(i.spicy>0)out.push([i.spicy===1?tg.mild:i.spicy===2?tg.medium:tg.hot,"warm"]);
  if(i.best)out.push([tg.bestseller||"Bestseller","warm"]);
  return out.filter(t=>t[0]).map(([t,c])=>[stripEmoji(t),c]);
}

/* ---- data ---- */
let NOTES={};
async function loadMenu(){
  showStatus(S().loading);
  const r=await fetch("/gastlyo/api/menu?r="+MENU_ID,{cache:"no-store"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const data=await r.json();
  NOTES=data.restaurant?.notes||{};
  const keys={pasta:"pasta",pizza:"pizza",hot:"hot"};NOTES=Object.fromEntries(Object.entries(NOTES).filter(([k])=>keys[k]));
  categoryOrder=data.categories||[];
  allItems=(data.items||[]).map(i=>({...i,id:String(i.id)}));
  byId=new Map(allItems.map(i=>[i.id,i]));
  for(const k of Object.keys(cart))if(!byId.has(k))delete cart[k];
  hideStatus();renderAll();
}
function showStatus(t,type){const el=$("status");el.textContent=t;el.className="status"+(type?" "+type:"");el.hidden=false}
function hideStatus(){$("status").hidden=true}

/* ---- rendering ---- */
function addBtn(i){return `<button type="button" class="icon-btn" data-add="${esc(i.id)}" aria-label="${esc(S().add)}: ${esc(nameOf(i))}">${ICON.plus}</button>`}
function rowHTML(i,opts={}){
  const tags=opts.compact?[]:tagsOf(i).slice(0,2),desc=descOf(i),size=sizeOf(i);
  return `<div class="row">
    <button type="button" class="open" data-open="${esc(i.id)}">${tile(i.cat)}
      <div style="min-width:0">
        <div class="name">${esc(nameOf(i))}</div>
        ${!opts.compact&&desc?`<div class="desc">${esc(desc)}</div>`:""}
        <div class="meta"><span class="price">${esc(priceOf(i))}</span>${size?`<span class="size">${esc(size)}</span>`:""}${tags.map(t=>`<span class="pill ${t[1]}">${esc(t[0])}</span>`).join("")}</div>
      </div>
    </button>${addBtn(i)}</div>`;
}
function renderHome(){
  const s=S();
  const chips=[["c1","q1"],["c2","q2"],["c3","q3"],["c4","q4"]].map(([c,q])=>`<button type="button" class="chip" data-ask="${esc(s[q])}">${esc(s[c])}</button>`).join("");
  $("homeChips").innerHTML=chips;$("kiwaChips").innerHTML=chips;
  const sp=allItems.find(i=>i.cat==="special");
  $("specialTitle").parentElement.hidden=!sp;
  $("special").innerHTML=sp?`<div class="special"><button type="button" class="open" data-open="${esc(sp.id)}">${tile("special")}<div style="min-width:0"><div class="eyebrow">${esc(s.special)}</div><div class="name" style="font-weight:800;font-size:16px;margin-top:2px">${esc(nameOf(sp))}</div><div class="desc" style="font-size:13px;color:var(--muted);margin-top:2px">${esc(descOf(sp))}</div><div class="price" style="margin-top:6px">${esc(priceOf(sp))}</div></div></button>${addBtn(sp)}</div>`:"";
  const feat=allItems.filter(i=>i.best&&i.cat!=="special");
  $("featured").innerHTML=feat.map(i=>`
    <div class="fcard">
      <button type="button" class="open" data-open="${esc(i.id)}">${tile(i.cat)}
        <div class="txt"><div class="name">${esc(nameOf(i))}</div><div class="desc">${esc(descOf(i)||catLabel(i.cat))}</div></div>
      </button>
      <div class="foot"><span class="price">${esc(priceOf(i))}</span>${addBtn(i)}</div>
    </div>`).join("");
  const cats=categoryOrder.filter(c=>c!=="special"&&allItems.some(i=>i.cat===c));
  $("catGrid").innerHTML=cats.map(c=>`<button type="button" class="cat-tile" data-cat="${esc(c)}">${tile(c)}<span>${esc(catLabel(c))}</span></button>`).join("");
}
function renderMenu(){
  const s=S(),q=$("searchInput").value.trim().toLowerCase();
  const cats=categoryOrder.filter(c=>allItems.some(i=>i.cat===c));
  $("catChips").innerHTML=[`<button type="button" class="chip" data-filter="all" aria-pressed="${currentCategory==="all"}">${esc(s.all)}</button>`]
    .concat(cats.map(c=>`<button type="button" class="chip" data-filter="${esc(c)}" aria-pressed="${currentCategory===c}">${esc(catLabel(c))}</button>`)).join("");
  if(!allItems.length){$("menuList").innerHTML="";return}
  const list=allItems.filter(i=>{
    if(currentCategory!=="all"&&i.cat!==currentCategory)return false;
    if(!q)return true;
    return [i.name,nameOf(i),descOf(i),(i.d||[]).join(" "),catLabel(i.cat)].join(" ").toLowerCase().includes(q);
  });
  if(!list.length){$("menuList").innerHTML=`<div class="empty">${esc(s.noResults)}</div>`;return}
  $("menuList").innerHTML=cats.map(c=>{
    const items=list.filter(i=>i.cat===c);if(!items.length)return "";
    const note=catNote(c,NOTES);
    return `<h2 class="cat-title">${esc(catLabel(c))}</h2>${note?`<p class="cat-note">${esc(note)}</p>`:""}<div class="dish-list">${items.map(i=>rowHTML(i)).join("")}</div>`;
  }).join("");
}
function mentioned(text){
  const t=String(text||"").toLowerCase();if(!t)return[];
  const hits=[];
  for(const i of allItems){
    const names=[nameOf(i),i.name].map(x=>x.toLowerCase()).filter(x=>x.length>2);
    let pos=-1;for(const n of names){const k=t.indexOf(n);if(k>=0&&(pos<0||k<pos))pos=k}
    if(pos>=0)hits.push({i,pos,len:Math.max(...names.map(n=>t.includes(n)?n.length:0))});
  }
  // drop hits whose name sits inside a longer matched name (e.g. "Margherita" inside "Joo Margherita")
  const keep=hits.filter(h=>!hits.some(o=>o!==h&&o.len>h.len&&o.pos<=h.pos&&o.pos+o.len>=h.pos+h.len));
  keep.sort((a,b)=>a.pos-b.pos);
  return keep.slice(0,3).map(h=>h.i);
}
function renderChat(){
  const s=S(),parts=[`<p class="msg bot">${esc(s.hello)}</p>`];
  for(const m of chat){
    if(m.role==="user")parts.push(`<p class="msg user">${esc(m.text)}</p>`);
    else if(m.role==="typing")parts.push(`<p class="msg bot" aria-label="${esc(UI().thinking||"…")}"><span class="typing"><i></i><i></i><i></i></span></p>`);
    else{parts.push(`<p class="msg bot">${esc(m.text)}</p>`);const ds=(m.ids||[]).map(id=>byId.get(id)).filter(Boolean);if(ds.length)parts.push(`<div class="chat-dishes">${ds.map(i=>rowHTML(i,{compact:true})).join("")}</div>`)}
  }
  $("chat").innerHTML=parts.join("");
}
function cartCount(){return Object.values(cart).reduce((a,b)=>a+b,0)}
function renderCart(){
  const s=S(),ids=Object.keys(cart).filter(id=>byId.has(id));
  const n=cartCount();$("cartBadge").hidden=!n;$("cartBadge").textContent=n;
  $("orderBottom").hidden=!ids.length;
  if(!ids.length){$("cartList").innerHTML=`<div class="empty">${esc(s.emptyCart)}<div style="margin-top:12px"><button type="button" class="link-btn" data-go="menu">${esc(s.toMenu)}</button></div></div>`;return}
  let sum=0;
  $("cartList").innerHTML=ids.map(id=>{const i=byId.get(id),q=cart[id];sum+=q*i.price;
    return `<div class="row"><button type="button" class="open" data-open="${esc(id)}">${tile(i.cat)}<div style="min-width:0"><div class="name">${esc(nameOf(i))}</div><div class="desc">${esc(money(q*i.price))}</div></div></button>
      <div class="stepper"><button type="button" data-dec="${esc(id)}" aria-label="${esc(s.less)}">${ICON.minus}</button><span>${q}</span><button type="button" data-inc="${esc(id)}" aria-label="${esc(s.more)}">${ICON.plus}</button></div></div>`}).join("");
  $("subtotal").textContent=money(sum);
}
function renderAll(){renderHome();renderMenu();renderChat();renderCart()}

/* ---- cart ---- */
function addToCart(id,n=1){const i=byId.get(String(id));if(!i)return;cart[id]=(cart[id]||0)+n;if(cart[id]<=0)delete cart[id];save(sessionStorage,"gastlyo_caffe_cart",cart);$("orderNotice").hidden=true;renderCart();if(n>0)toast(`${nameOf(i)} · ${S().added}`,ICON.check)}

/* ---- dish sheet ---- */
let sheetQty=1,sheetId=null;
function openDish(id){const i=byId.get(String(id));if(!i)return;sheetId=String(id);sheetQty=1;lastFocus=document.activeElement;drawDish();$("dishSheet").hidden=false;document.body.style.overflow="hidden";$("dishPanel").scrollTop=0;$("dishPanel").querySelector(".sheet-close").focus()}
function pairsFor(i){
  const drinks=["hot","cold","aperitivo","cocktails","mocktails","wine_beer","digestivo"];
  let want;
  if(i.cat==="breakfast")want=[["hot",84],["cold",110]];
  else if(drinks.includes(i.cat))want=[["antipasti",20],["focaccia",54]];
  else if(["pizza","pasta","special","focaccia"].includes(i.cat))want=[["aperitivo",122],["hot",80]];
  else want=[["focaccia",54],["aperitivo",122]];
  return want.map(([c,id])=>byId.get(String(id))||allItems.find(x=>x.cat===c)).filter(x=>x&&x.id!==i.id).slice(0,2);
}
function drawDish(){
  const i=byId.get(sheetId),s=S(),desc=descOf(i),size=sizeOf(i),pairs=pairsFor(i),note=catNote(i.cat,NOTES);
  $("dishPanel").innerHTML=`
    <button type="button" class="sheet-close" data-close aria-label="${esc(s.close)}">${ICON.close}</button>
    ${tile(i.cat,"dish-hero")}
    <div class="dish-body">
      <div class="eyebrow">${esc(catLabel(i.cat))}</div>
      <div class="dish-top" style="margin-top:4px"><h2 id="dishName">${esc(nameOf(i))}</h2><span class="price">${esc(priceOf(i))}</span></div>
      ${desc?`<p class="dish-desc">${esc(desc)}</p>`:""}
      ${size?`<p class="label-text" style="color:var(--muted)">${esc(size)}</p>`:""}
      <div class="tags">${tagsOf(i).map(t=>`<span class="pill ${t[1]}">${esc(t[0])}</span>`).join("")}</div>
      ${note?`<p class="hint">${esc(note)}</p>`:""}
      ${pairs.length?`<div class="label" style="margin-top:22px">${esc(s.pairs)}</div><div class="pairs" style="margin-top:10px">${pairs.map(p=>`<button type="button" class="pair" data-open="${esc(p.id)}">${tile(p.cat)}<div><strong>${esc(nameOf(p))}</strong><span>+ ${esc(priceOf(p))}</span></div></button>`).join("")}</div>`:""}
      <div class="add-bar">
        <div class="stepper"><button type="button" data-sq="-1" aria-label="${esc(s.less)}">${ICON.minus}</button><span>${sheetQty}</span><button type="button" data-sq="1" aria-label="${esc(s.more)}">${ICON.plus}</button></div>
        <button type="button" class="btn-primary" data-sheet-add>${esc(s.add)} · ${esc(money(i.price*sheetQty))}</button>
      </div>
    </div>`;
}
function closeSheet(id){$(id).hidden=true;document.body.style.overflow="";if(lastFocus&&lastFocus.focus)lastFocus.focus()}

/* ---- language ---- */
function openLang(){lastFocus=document.activeElement;$("langTitle").textContent=UI().language||"Language";$("langItems").innerHTML=LANGS.map(([c,n])=>`<button type="button" class="lang-item" data-lang="${c}" lang="${c}" aria-current="${c===lang}"><span>${esc(n)}</span><small>${c.toUpperCase()}</small></button>`).join("");$("langSheet").hidden=false;document.body.style.overflow="hidden";($("langItems").querySelector('[aria-current="true"]')||$("langItems").firstElementChild).focus()}
function applyLanguage(l){
  lang=supportedLanguages.includes(l)?l:"en";save(localStorage,"restaurant-language",lang);
  const rtl=["fa","ar"].includes(lang);document.documentElement.lang=lang;document.documentElement.dir=rtl?"rtl":"ltr";
  document.querySelectorAll("svg.flip").forEach(e=>e.style.transform=rtl?"scaleX(-1)":"");
  const s=S(),u=UI();
  $("langCode").textContent=lang.toUpperCase();$("langBtn").setAttribute("aria-label",u.language||"Language");
  $("demoNote").textContent=s.demo;$("heroHello").textContent=s.hello;$("heroInput").placeholder=s.askPh;$("chatInput").placeholder=s.askPh;
  $("heroSend").setAttribute("aria-label",s.sendQ);$("chatSend").setAttribute("aria-label",s.sendQ);
  $("specialTitle").textContent=s.special;$("popularTitle").textContent=s.popular;$("seeAll").textContent=s.seeAll;$("catsTitle").textContent=s.cats;
  $("menuTitle").textContent=s.menu;$("searchInput").placeholder=s.searchPh;$("searchLabel").textContent=s.searchPh;
  $("kiwaSub").textContent=s.kiwaSub;$("orderTitle").textContent=s.yourOrder;$("tableLabel").textContent=s.table;
  $("noteInput").placeholder=s.note;$("noteLabel").textContent=s.note;$("subtotalLabel").textContent=s.subtotal;$("sendOrder").textContent=s.send;$("orderNoticeText").textContent=s.demoSent;
  $("navHome").textContent=s.home;$("navMenu").textContent=s.menu;$("navOrder").textContent=s.order;$("navCall").textContent=s.call;
  renderAll();if(!$("dishSheet").hidden)drawDish();
}

/* ---- KIWA ---- */
async function ask(message){
  message=String(message||"").trim();if(!message||chatBusy)return;
  if(currentView()!=="kiwa")go("kiwa");
  chatBusy=true;$("chatSend").disabled=true;chat.push({role:"user",text:message},{role:"typing"});renderChat();scrollChat();
  let reply,ids=[];
  try{
    const r=await fetch("/gastlyo/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,language:lang,sessionId:sessionId(),restaurant:MENU_ID})});
    const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Server error");
    reply=d.answer||UI().error;ids=mentioned(reply).map(i=>i.id);
  }catch(e){console.error(e);reply=UI().error||"Error"}
  chat=chat.filter(m=>m.role!=="typing");chat.push({role:"bot",text:reply,ids});chatBusy=false;$("chatSend").disabled=false;renderChat();scrollChat();
}
function scrollChat(){requestAnimationFrame(()=>{const last=$("chat").lastElementChild;if(last)last.scrollIntoView({block:"end",behavior:"smooth"})})}
function toast(text,icon){const t=$("toast");t.innerHTML=(icon||"")+`<span>${esc(text)}</span>`;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,2600)}

/* ---- routing ---- */
const VIEWS=["home","menu","kiwa","order"];
function currentView(){const h=location.hash.replace("#","");return VIEWS.includes(h)?h:"home"}
function go(v){if(v==="home"){if(location.hash){history.pushState(null,"",location.pathname+location.search)}showView()}else if(location.hash!=="#"+v){location.hash=v}else showView()}
function showView(){const v=currentView();document.querySelectorAll("[data-view]").forEach(s=>s.hidden=s.dataset.view!==v);document.querySelectorAll(".nav-btn[data-go]").forEach(b=>b.dataset.go===v?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));window.scrollTo(0,0);if(v==="kiwa"&&!chat.length)setTimeout(()=>$("chatInput").focus({preventScroll:true}),50)}
window.addEventListener("hashchange",showView);window.addEventListener("popstate",showView);

document.addEventListener("click",e=>{
  const t=e.target.closest("button,a");if(!t)return;const d=t.dataset;
  if(d.go){e.preventDefault();if(!$("dishSheet").hidden)closeSheet("dishSheet");go(d.go);return}
  if(d.open){openDish(d.open);return}
  if(d.add){addToCart(d.add,1);return}
  if(d.inc){addToCart(d.inc,1);return}
  if(d.dec){addToCart(d.dec,-1);return}
  if(d.cat){currentCategory=d.cat;go("menu");renderMenu();return}
  if(d.filter){currentCategory=d.filter;renderMenu();return}
  if(d.ask){ask(d.ask);return}
  if(d.lang){applyLanguage(d.lang);closeSheet("langSheet");return}
  if(d.close!==undefined){closeSheet("dishSheet");return}
  if(d.sq){sheetQty=Math.max(1,sheetQty+Number(d.sq));drawDish();return}
  if(d.sheetAdd!==undefined){addToCart(sheetId,sheetQty);closeSheet("dishSheet");return}
});
["dishSheet","langSheet"].forEach(id=>$(id).addEventListener("click",e=>{if(e.target.id===id)closeSheet(id)}));
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("dishSheet").hidden)closeSheet("dishSheet");else if(!$("langSheet").hidden)closeSheet("langSheet")}});
$("langBtn").addEventListener("click",openLang);
$("callBtn").addEventListener("click",()=>toast(S().callToast,ICON.bell));
$("searchInput").addEventListener("input",renderMenu);
$("heroAsk").addEventListener("submit",e=>{e.preventDefault();const v=$("heroInput").value;$("heroInput").value="";ask(v)});
$("chatForm").addEventListener("submit",e=>{e.preventDefault();const v=$("chatInput").value;$("chatInput").value="";ask(v)});
$("sendOrder").addEventListener("click",()=>{if(!cartCount())return;$("orderNotice").hidden=false;$("orderNotice").scrollIntoView({block:"nearest",behavior:"smooth"})});
(function(){const p=new URLSearchParams(location.search),t=p.get("table")||p.get("tisch");if(t)save(sessionStorage,"gastlyo_table",t.slice(0,4));$("tableInput").value=sessionStorage.getItem("gastlyo_table")||"";$("tableInput").addEventListener("input",e=>save(sessionStorage,"gastlyo_table",e.target.value))})();

function detectLanguage(){
  const q=new URLSearchParams(location.search).get("lang");if(q&&supportedLanguages.includes(q))return q;
  const saved=localStorage.getItem("restaurant-language");if(saved&&supportedLanguages.includes(saved))return saved;
  for(const l of (navigator.languages||[navigator.language||"de"])){const b=String(l).toLowerCase().split("-")[0];if(supportedLanguages.includes(b))return b}
  return "de";
}
applyLanguage(detectLanguage());showView();
loadMenu().catch(err=>{console.error(err);showStatus(S().loadError,"error")});
</script>
