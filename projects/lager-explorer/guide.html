 Begehung.", "guideFutureTitle": "Mögliche nächste Ausbaustufen", "guideFuture": "Denkbare Erweiterungen (nicht Bestandteil dieser Demo): Barcode-/QR-Erfassung, mobile Ansicht, rollenbasierte Ansichten, Suchhistorie, einfache Berichte, Genehmigungs- und Änderungsprotokolle sowie eine spätere Schnittstelle zu autorisierten Datenquellen.", "guideKpiTitle": "Mögliche KPI-Namen", "guideKpis": "Lagerauslastung · Freie Kapazität · Einlagerungsleistung · Auslagerungsleistung · Kommissionierleistung · Durchlaufzeit · Bestandsgenauigkeit · Lagerplatz-Suchzeit · Umlagerungsquote · Flächennutzungsgrad.", "guideKpiNote": "Mögliche Kennzahlen für eine spätere Ausbaustufe; die Demo misst diese Kennzahlen nicht live.", "g2_eyebrow": "Interaktive Lagerdemo · fiktive Daten", "g2_h1": "Warehouse Visual Explorer", "g2_note": "12 Regalzeilen · 6 Gänge · Plätze 100–215 · 4 Paletten je Fach · 7 Ebenen", "g2_overview_eye": "Übersicht", "g2_overview_h2": "Lagerübersicht", "g2_overview_note": "Schematische Darstellung der Zeilen, Gänge und Sonderflächen.", "g2_occ_eye": "2D Belegung", "g2_occ_h2": "Lagerbelegung je Platz", "g2_level": "Ebene", "g2_color": "Färbung", "g2_btn_occ": "Belegung", "g2_btn_customer": "Kunde", "g2_search": "Platz suchen", "g2_detail_eye": "Platzdetail", "g2_select": "Platz wählen", "g2_click": "Klicken Sie im Plan auf ein Feld.", "g2_bottom": "Feld anklicken zeigt alle 7 Ebenen dieses Platzes. Alle Daten sind fiktiv.", "g3_eyebrow": "Interaktive Lagerdemo · 3D Ansicht · fiktive Daten", "g3_h1": "3D Lageransicht", "g3_note": "Räumliche Ansicht des Demo-Lagers", "g3_pause": "Pause", "g3_speed": "Tempo", "g3_view": "Ansicht", "g3_toLevel": "Bis Ebene", "g3_color": "Färbung", "g3_customer": "Kunde", "g3_fill": "Füllgrad", "g3_effects": "Effekte", "g3_showPlace": "Platz zeigen", "g3_mode": "Modus", "g3_stock": "Bestand", "g3_free": "Freie Plätze", "g3_same": "Gleicher Artikel", "g3_searchItem": "Artikel suchen", "g3_walk": "Begehung"}, "en": {"appTitle": "Warehouse Visual Explorer", "appSub": "Interactive warehouse demo · fictitious data", "tab2d": "2D occupancy", "tab3d": "3D interactive", "tabGuide": "Help / Guide", "langLabel": "Language", "footer": "Rahmatallah (Keywan) Fakhri Fakhrabadi", "guideTitle": "Help & User Guide", "guideIntroTitle": "Demo note", "guideIntro": "This file is only a personal concept demo with fictitious data. It is meant to show how a visual warehouse view could work. If the idea is interesting, it can later be developed further with approved and confirmed information.", "guide2dTitle": "2D occupancy – what is it for?", "guide2d": "The 2D view is for a fast overview of rows, aisles, levels and individual storage locations. It helps with finding an address, highlighting a slot and recognizing occupied or free areas.", "guide3dTitle": "3D interactive – what is it for?", "guide3d": "The 3D view is intended for spatial visualization. You can rotate the warehouse, zoom in, change the view and understand how rack rows, levels and pallets look in space.", "guide3dUseTitle": "How to use the 3D view", "guide3dUse": "With the mouse: left button rotates, wheel zooms, right button pans. In walk mode: use W/A/S/D to move, Q/E to change height, Esc to exit walk mode.", "guideButtonsTitle": "Important controls", "guideButtons": "2D: choose level, switch coloring, search slot, click any field. 3D: camera view, coloring, mode, speed, slot search and walk mode.", "guideFutureTitle": "Possible next steps", "guideFuture": "For example: barcode or QR scan, mobile view, quick slot finder, simple reports, search history, role-based views for warehouse and managers, and later use of approved real information.", "guideKpiTitle": "Possible KPI names", "guideKpis": "Occupancy rate, free capacity, putaways, withdrawals, pick rate, relocations, search hit rate, inventory accuracy, access frequency by zone, throughput time.", "guideKpiNote": "These indicators can later be used in a KPI dashboard.", "g2_eyebrow": "Interactive warehou چیست؟", "guide3d": "نمای سه‌بعدی برای نمایش فضایی است. می‌توان انبار را چرخاند، زوم کرد، زاویه دید را عوض کرد و جای ردیف‌ها، طبقات و پالت‌ها را بهتر فهمید.", "guide3dUseTitle": "نحوه استفاده از نمای سه‌بعدی", "guide3dUse": "با ماوس: دکمه چپ برای چرخش، چرخ ماوس برای زوم، دکمه راست برای جابه‌جایی. در حالت حرکت: با W/A/S/D حرکت کنید، با Q/E ارتفاع را عوض کنید و با Esc از حالت حرکت خارج شوید.", "guideButtonsTitle": "دکمه‌ها و کنترل‌های مهم", "guideButtons": "دو‌بعدی: انتخاب طبقه، تغییر رنگ‌بندی، جست‌وجوی جایگاه و کلیک روی خانه‌ها. سه‌بعدی: زاویه دوربین، رنگ‌بندی، حالت، سرعت، جست‌وجوی جایگاه و حرکت در محیط.", "guideFutureTitle": "امکانات توسعه در آینده", "guideFuture": "مثلاً: اسکن بارکد یا QR، نسخه موبایل، جست‌وجوی سریع جایگاه، گزارش‌های ساده، تاریخچه جست‌وجو، نماهای جدا برای انبار و مدیریت و بعداً استفاده از اطلاعات واقعیِ مجاز.", "guideKpiTitle": "نام KPIهای قابل استفاده", "guideKpis": "نرخ اشغال، ظرفیت آزاد، تعداد ورودی، تعداد خروجی، نرخ پیک، جابه‌جایی داخلی، دقت جست‌وجو، دقت موجودی، فراوانی دسترسی هر زون، زمان گردش.", "guideKpiNote": "بعداً می‌توان از این شاخص‌ها در داشبورد KPI استفاده کرد.", "g2_eyebrow": "دموی تعاملی انبار · داده‌های ساختگی", "g2_h1": "Warehouse Visual Explorer", "g2_note": "۱۲ ردیف قفسه · ۶ راهرو · جایگاه‌های 100 تا 215 · ۴ پالت در هر بخش · ۷ طبقه", "g2_overview_eye": "نمای کلی", "g2_overview_h2": "نمای کلی انبار", "g2_overview_note": "نمای شماتیک ردیف‌ها، راهروها و بخش‌های ویژه.", "g2_occ_eye": "نمای دو‌بعدی", "g2_occ_h2": "وضعیت جایگاه‌ها", "g2_level": "طبقه", "g2_color": "رنگ‌بندی", "g2_btn_occ": "اشغال", "g2_btn_customer": "مشتری", "g2_search": "جست‌وجوی جایگاه", "g2_detail_eye": "جزئیات جایگاه", "g2_select": "انتخاب جایگاه", "g2_click": "روی یکی از خانه‌های نقشه کلیک کنید.", "g2_bottom": "با کلیک روی هر خانه، هر ۷ طبقه آن جایگاه نمایش داده می‌شود. همه داده‌ها ساختگی هستند.", "g3_eyebrow": "دموی تعاملی انبار · نمای سه‌بعدی · داده‌های ساختگی", "g3_h1": "نمای سه‌بعدی انبار", "g3_note": "نمای فضایی از انبار دمو", "g3_pause": "توقف", "g3_speed": aha sonra onaylı gerçek bilgilerin kullanımı.", "guideKpiTitle": "Olası KPI adları", "guideKpis": "Doluluk oranı, boş kapasite, girişler, çıkışlar, pick rate, iç taşıma, arama başarı oranı, stok doğruluğu, bölge bazlı erişim sıklığı, çevrim süresi.", "guideKpiNote": "Bu göstergeler daha sonra bir KPI panosunda kullanılabilir.", "g2_eyebrow": "Etkileşimli depo demosu · kurgusal veriler", "g2_h1": "Warehouse Visual Explorer", "g2_note": "12 raf sırası · 6 koridor · 100–215 yerleri · göz başına 4 palet · 7 seviye", "g2_overview_eye": "Genel görünüm", "g2_overview_h2": "Depo genel görünümü", "g2_overview_note": "Sıraların, koridorların ve özel alanların şematik görünümü.", "g2_occ_eye": "2D görünüm", "g2_occ_h2": "Yer bazında doluluk", "g2_level": "Seviye", "g2_color": "Renklendirme", "g2_btn_occ": "Doluluk", "g2_btn_customer": "Müşteri", "g2_search": "Yer bul", "g2_detail_eye": "Yer detayları", "g2_select": "Yer seçin", "g2_click": "Haritada bir alana tıklayın.", "g2_bottom": "Bir alana tıklamak o yerin 7 seviyesini gösterir. Tüm veriler kurgusaldır.", "g3_eyebrow": "Etkileşimli depo demosu · 3D görünüm · kurgusal veriler", "g3_h1": "3D depo görünümü", "g3_note": "Demo deponun mekânsal görünümü", "g3_pause": "Duraklat", "g3_speed": "Hız", "g3_view": "Görünüm", "g3_toLevel": "Seviyeye kadar", "g3_color": "Renklendirme", "g3_customer": "Müşteri", "g3_fill": "Doluluk oranı", "g3_effects": "Efektler", "g3_showPlace": "Yeri göster", "g3_mode": "Mod", "g3_stock": "Stok", "g3_free": "Boş yerler", "g3_same": "Aynı ürün", "g3_searchItem": "Ürün ara", "g3_walk": "Yürüme modu"}, "ar": {"appTitle": "Warehouse Visual Explorer", "appSub": "عرض تفاعلي للمستودع · بيانات تجريبية", "tab2d": "عرض ثنائي الأبعاد", "tab3d": "عرض ثلاثي الأبعاد", "tabGuide": "الدليل", "langLabel": "اللغة", "footer": "Rahmatallah (Keywan) Fakhri Fakhrabadi", "guideTitle": "الدليل وطريقة الاستخدام", "guideIntroTitle": "ملاحظة حول النسخة التجريبية", "guideIntro": "هذا الملف مجرد نموذج مفاهيمي شخصي ببيانات تجريبية غير حقيقية. الهدف منه عرض فكرة لواجهة بصرية للمستودع. إذا كانت الفكرة مفيدة، يمكن تطويرها لاحقاً بمعلومات حقيقية معتمدة ومسموح بها.", "guide2dTitle": "ما فائدة العرض الثنائي الأبعاد؟", "guide2d": "العرض الثنائي الأبعاد مناسب للحصول على نظرة سريعة على الصفوف والممرات والمستويات والمواقع التخزينية الفردية. يساعد في البحث عن عنوان وتحديد موقع ومعرفة المناطق المشغولة أو الفارغة.", "guide3dTitle": "ما فائدة العرض الثلاثي الأبعاد؟", "guide3d": "العرض الثلاثي الأبعاد مخصص للفهم المكاني. يمكنك تدوير المستودع والتكبير وتغيير زاوية الرؤية وفهم أماكن الصفوف والمستويات والطبالي بشكل أفضل.", "guide3dUseTitle": "كيفية استخدام العرض الثلاثي الأبعاد", "guide3dUse": "باستخدام الفأرة: الزر الأيسر للدوران، عجلة الفأرة للتكبير، الزر الأيمن للتحريك. في وضع التجول: استخدم W/A/S/D للحركة و Q/E لتغيير الارتفاع و Esc للخروج.", "guideButtonsTitle": "أهم أدوات التحكم", "guideButtons": "في 2D: اختيار المستوى، تغيير التلوين، البحث عن موقع، النقر على الحقول. في 3D: زاوية الكاميرا، التلوين، الوضع، السرعة، البحث عن موقع ووضع التجول.", "guideFutureTitle": "تطويرات ممكنة لاحقاً", "guideFuture": "مثلاً: مسح باركود أو QR، عرض للهاتف، أداة سريعة للبحث عن الموقع، تقارير بسيطة، سجل للبحث، واجهات مختلفة للمستودع والإدارة، ثم استخدام معلومات حقيقية معتمدة.", "guideKpiTitle": "أسماء مؤشرات KPI الممكنة", "guideKpis": "نسبة الإشغال، السعة المتاحة، الإدخالات، الإخراجات، معدل الالتقاط، النقل الداخلي، دقة البحث، دقة المخزون، تكرار الوصول حسب المنطقة، زمن الدورة.", "guideKpiNote": "يمكن استخدام هذه المؤشرات لاحقاً داخل لوحة KPI.", "g2_eyebrow": "عرض تفاعلي للمستودع · بيانات تجريبية", "g2_h1": "Warehouse Visual Explorer", "g2_note": "12 صف رفوف · 6 ممرات · المواقع 100–215 · 4 طبالي لكل خانة · 7 مستويات", "g2_overview_eye": "نظرة عامة", "g2_overview_h2": "نظرة عامة على المستودع", "g2_overview_note": "عرض تخطيطي للصفوف والممرات والمناطق الخاصة.", "g2_occ_eye": "عرض ثنائي الأبعاد", "g2_occ_h2": "إشغال المواقع", "g2_level": "المستوى", "g2_color": "التلوين", "g2_btn_occ": "الإشغال", "g2_btn_customer": "العميل", "g2_search": "البحث عن موقع", "g2_detail_eye": "تفاصيل الموقع", "g2_select": "اختر موقعاً", "g2_click": "انقر على أي خانة في الخريطة.", "g2_bottom": "النقر على أي خانة يعرض جميع مستويات هذا الموقع السبعة. كل البيانات تجريبية.", "g3_eyebrow": "عرض تفاعلي للمستودع · عرض ثلاثي الأبعاد · بيانات تجريبية", "g3_h1": "عرض المستودع ثلاثي الأبعاد", "g3_note": "عرض مكاني للمستودع التجريبي", "g3_pause": "إيقاف", "g3_speed": "السرعة", "g3_view": "العرض", "g3_toLevel": "حتى المستوى", "g3_color": "التلوين", "g3_customer": "العميل", "g3_fill": "نسبة الامتلاء", "g3_effects": "المؤثرات", "g3_showPlace": "إظهار الموقع", "g3_mode": "الوضع", "g3_stock": "المخزون", "g3_free": "المواقع الفارغة", "g3_same": "نفس الصنف", "g3_searchItem": "البحث عن الصنف", "g3_walk": "وضع التجول"}, "fr": {"appTitle": "Warehouse Visual Explorer", "appSub": "Démo interactive d’entrepôt · données fictives", "tab2d": "Vue 2D", "tab3d": "Vue 3D", "tabGuide": "Aide / Guide", "langLabel": "Langue", "footer": "Rahmatallah (Keywan) Fakhri Fakhrabadi", "guideTitle": "Aide et mode d’emploi", "guideIntroTitle": "Note sur la démo", "guideIntro": "Ce fichier est seulement une démo conceptuelle personnelle avec des données fictives. Il sert à montrer à quoi pourrait ressembler une vue visuelle d’entrepôt. Si l’idée est intéressante, elle pourra être développée plus tard avec des informations réelles autorisées et confirmées.", "guide2dTitle": "À quoi sert la vue 2D ?", "guide2d": "La vue 2D donne un aperçu rapide des rangées, allées, niveaux et emplacements individuels. Elle aide à trouver une adresse, mettre en évidence un emplacement et repérer les zones occupées ou libres.", "guide3dTitle": "À quoi sert la vue 3D ?", "guide3d": "La vue 3D est destinée à la visualisation spatiale. On peut faire pivoter l’entrepôt, zoomer, changer la vue et mieux comprendre la disposition des rangées, niveaux et palettes.", "guide3dUseTitle": "Comment utiliser la vue 3D", "guide3dUse": "Avec la souris : clic gauche pour pivoter, molette pour zoomer, clic droit pour déplacer. En mode visite : W/A/S/D pour se déplacer, Q/E pour changer la hauteur, Esc pour quitter.", "guideButtonsTitle": "Commandes importantes", "guideButtons": "2D : choisir le niveau, changer la coloration, chercher un emplacement, cliquer sur une case. 3D : vue caméra, coloration, mode, vitesse, recherche d’emplacement et mode visite.", "guideFutureTitle": "Évolutions possibles", "guideFuture": "Par exemple : scan code-barres ou QR, vue mobile, recherche rapide d’emplacement, rapports simples, historique de recherche, vues par rôle pour l’entrepôt et la direction, puis utilisation d’informations réelles autorisées.", "guideKpiTitle": "Noms de KPI possibles", "guideKpis": "Taux d’occupation, capacité libre, mises en stock, sorties, pick rate, déplacements internes, taux de réussite de recherche, précision du stock, fréquence d’accès par zone, temps de cycle.", "guideKpiNote": "Ces indicateurs pourront être utilisés plus tard dans un tableau de bord KPI.", "g2_eyebrow": "Démo interactive d’entrepôt · données fictives", "g2_h1": "Warehouse Visual Explorer", "g2_note": "12 rangées · 6 allées · emplacements 100–215 · 4 palettes par case · 7 niveaux", "g2_overview_eye": "Vue d’ensemble", "g2_overview_h2": "Vue générale de l’entrepôt", "g2_overview_note": "Vue schématique des rangées, allées et zones spéciales.", "g2_occ_eye": "Vue 2D", "g2_occ_h2": "Occupation par emplacement", "g2_level": "Niveau", "g2_color": "Coloration", "g2_btn_occ": "Occupation", "g2_btn_customer": "Client", "g2_search": "Chercher un emplacement", "g2_detail_eye": "Détails de l’emplacement", "g2_select": "Choisir un emplacement", "g2_click": "Cliquez sur une case du plan.", "g2_bottom": "Cliquer sur une case affiche les 7 niveaux de cet emplacement. Toutes les données sont fictives.", "g3_eyebrow": "Démo interactive d’entrepôt · vue 3D · données fictives", "g3_h1": "Vue 3D de l’entrepôt", "g3_note": "Vue spatiale de l’entrepôt de démonstration", "g3_pause": "Pause", "g3_speed": "Vitesse", "g3_view": "Vue", "g3_toLevel": "Jusqu’au niveau", "g3_color": "Coloration", "g3_customer": "Client", "g3_fill": "Taux de remplissage", "g3_effects": "Effets", "g3_showPlace": "Montrer l’emplacement", "g3_mode": "Mode", "g3_stock": "Stock", "g3_free": "Emplacements libres", "g3_same": "Même article", "g3_searchItem": "Chercher un article", "g3_walk": "Mode visite"}, "it": {"appTitle": "Warehouse Visual Explorer", "appSub": "Demo interattiva del magazzino · dati fittizi", "tab2d": "Occupazione 2D", "tab3d": "3D interattivo", "tabGuide": "Aiuto / Guida", "langLabel": "Lingua", "footer": "Rahmatallah (Keywan) Fakhri Fakhrabadi", "guideTitle": "Aiuto e guida", "guideIntroTitle": "Nota sulla demo", "guideIntro": "Questo file è solo una demo personale di concetto con dati fittizi. Mostra come potrebbe funzionare una vista visiva del magazzino. Se l'idea interessa, può essere sviluppata in seguito con informazioni approvate e verificate.", "guide2dTitle": "Occupazione 2D – a cosa serve?", "guide2d": "La vista 2D offre una panoramica rapida di file, corsie, livelli e singole ubicazioni. Aiuta a trovare un indirizzo, evidenziare un posto e riconoscere aree occupate o libere.", "guide3dTitle": "3D interattivo – a cosa serve?", "guide3d": "La vista 3D serve per la rappresentazione spaziale. Si può ruotare il magazzino, ingrandire, cambiare vista e capire come appaiono nello spazio file di scaffali, livelli e pallet.", "guide3dUseTitle": "Come usare la vista 3D", "guide3dUse": "Con il mouse: il tasto sinistro ruota, la rotella fa zoom, il tasto destro sposta. In modalità percorso: W/A/S/D per muoversi, Q/E per l'altezza, Esc per uscire.", "guideButtonsTitle": "Comandi principali", "guideButtons": "2D: scegliere il livello, cambiare colorazione, cercare un posto, cliccare un campo. 3D: vista camera, colorazione, modalità, velocità, ricerca posto e modalità percorso.", "guideFutureTitle": "Possibili passi successivi", "guideFuture": "Per esempio: scansione barcode o QR, vista mobile, ricerca rapida dei posti, report semplici, cronologia ricerche, viste per ruoli e, in seguito, uso di informazioni reali approvate.", "guideKpiTitle": "Possibili KPI", "guideKpis": "Tasso di occupazione, capacità libera, stoccaggi, prelievi, rendimento picking, ricollocazioni, tasso di ritrovamento, accuratezza inventario, frequenza di accesso per zona, tempo di attraversamento.", "guideKpiNote": "Questi indicatori possono essere usati in seguito in una dashboard KPI.", "g2_eyebrow": "Demo interattiva del magazzino · dati fittizi", "g2_h1": "Warehouse Visual Explorer", "g2_note": "12 file di scaffali · 6 corsie · posti 100–215 · 4 pallet per campata · 7 livelli", "g2_overview_eye": "Panoramica", "g2_overview_h2": "Panoramica del magazzino", "g2_overview_note": "Vista schematica di file, corsie e aree speciali.", "g2_occ_eye": "Occupazione 2D", "g2_occ_h2": "Occupazione per posto", "g2_level": "Livello", "g2_color": "Colorazione", "g2_btn_occ": "Occupazione", "g2_btn_customer": "Cliente", "g2_search": "Cerca posto", "g2_detail_eye": "Dettagli posto", "g2_select": "Seleziona un posto", "g2_click": "Clicca un campo sulla mappa.", "g2_bottom": "Clicca un campo per vedere tutti i 7 livelli del posto. Tutti i dati sono fittizi.", "g3_eyebrow": "Demo interattiva del magazzino · vista 3D · dati fittizi", "g3_h1": "Vista 3D del magazzino", "g3_note": "Vista spaziale del magazzino demo", "g3_pause": "Pausa", "g3_speed": "Velocità", "g3_view": "Vista", "g3_toLevel": "Fino al livello", "g3_color": "Colorazione", "g3_customer": "Cliente", "g3_fill": "Riempimento", "g3_effects": "Effetti", "g3_showPlace": "Mostra posto", "g3_mode": "Modalità", "g3_stock": "Giacenza", "g3_free": "Posti liberi", "g3_same": "Stesso articolo", "g3_searchItem": "Cerca articolo", "g3_walk": "Percorso"}, "es": {"appTitle": "Warehouse Visual Explorer", "appSub": "Demo interactiva de almacén · datos ficticios", "tab2d": "Ocupación 2D", "tab3d": "3D interactivo", "tabGuide": "Ayuda / Guía", "langLabel": "Idioma", "footer": "Rahmatallah (Keywan) Fakhri Fakhrabadi", "guideTitle": "Ayuda y guía de uso", "guideIntroTitle": "Nota sobre la demo", "guideIntro": "Este archivo es solo una demo personal de concepto con datos ficticios. Muestra cómo podría funcionar una vista visual del almacén. Si la idea resulta interesante, puede desarrollarse más adelante con información aprobada y confirmada.", "guide2dTitle": "Ocupación 2D – ¿para qué sirve?", "guide2d": "La vista 2D ofrece una visión rápida de filas, pasillos, niveles y ubicaciones. Ayuda a encontrar una dirección, marcar una ubicación y reconocer zonas ocupadas o libres.", "guide3dTitle": "3D interactivo – ¿para qué sirve?", "guide3d": "La vista 3D sirve para la representación espacial. Se puede girar el almacén, acercar, cambiar la vista y entender cómo se ven en el espacio las filas de estanterías, los niveles y los palés.", "guide3dUseTitle": "Cómo usar la vista 3D", "guide3dUse": "Con el ratón: el botón izquierdo gira, la rueda hace zoom, el botón derecho desplaza. En modo recorrido: W/A/S/D para moverse, Q/E para la altura, Esc para salir.", "guideButtonsTitle": "Controles importantes", "guideButtons": "2D: elegir nivel, cambiar coloración, buscar ubicación, hacer clic en un campo. 3D: vista de cámara, coloración, modo, velocidad, búsqueda de ubicación y modo recorrido.", "guideFutureTitle": "Posibles próximos pasos", "guideFuture": "Por ejemplo: escaneo de código de barras o QR, vista móvil, búsqueda rápida de ubicaciones, informes sencillos, historial de búsqueda, vistas por roles y, más adelante, uso de información real aprobada.", "guideKpiTitle": "Posibles KPI", "guideKpis": "Tasa de ocupación, capacidad libre, entradas, salidas, rendimiento de picking, reubicaciones, tasa de acierto en búsquedas, exactitud de inventario, frecuencia de acceso por zona, tiempo de paso.", "guideKpiNote": "Estos indicadores pueden usarse más adelante en un panel de KPI.", "g2_eyebrow": "Demo interactiva de ": "Pamja 2D jep një përmbledhje të shpejtë të rreshtave, korridoreve, niveleve dhe vendeve të magazinimit. Ndihmon për të gjetur një adresë, për të shënuar një vend dhe për të dalluar zonat e zëna ose të lira.", "guide3dTitle": "3D interaktiv – për çfarë shërben?", "guide3d": "Pamja 3D shërben për paraqitjen hapësinore. Mund ta rrotullosh magazinën, ta zmadhosh, të ndryshosh pamjen dhe të kuptosh si duken në hapësirë rreshtat e rafteve, nivelet dhe paletat.", "guide3dUseTitle": "Si përdoret pamja 3D", "guide3dUse": "Me maus: butoni i majtë rrotullon, rrota zmadhon, butoni i djathtë zhvendos. Në modalitetin e ecjes: W/A/S/D për lëvizje, Q/E për lartësinë, Esc për dalje.", "guideButtonsTitle": "Komandat kryesore", "guideButtons": "2D: zgjidh nivelin, ndrysho ngjyrosjen, kërko vendin, kliko një fushë. 3D: pamja e kamerës, ngjyrosja, modaliteti, shpejtësia, kërkimi i vendit dhe ecja.", "guideFutureTitle": "Hapat e mundshëm të ardhshëm", "guideFuture": "Për shembull: skanim barkodi ose QR, pamje për celular, kërkim i shpejtë i vendeve, raporte të thjeshta, historik kërkimi, pamje sipas roleve dhe më vonë përdorim i informacioneve reale të miratuara.", "guideKpiTitle": "KPI të mundshme", "guideKpis": "Shkalla e zënies, kapaciteti i lirë, hyrjet, daljet, performanca e picking-ut, zhvendosjet, shkalla e gjetjes, saktësia e inventarit, frekuenca e aksesit sipas zonës, koha e kalimit.", "guideKpiNote": "Këta tregues mund të përdoren më vonë në një panel KPI.", "g2_eyebrow": "Demo interaktive e magazinës · të dhëna fiktive", "g2_h1": "Warehouse Visual Explorer", "g2_note": "12 rreshta raftesh · 6 korridore · vende 100–215 · 4 paleta për seksion · 7 nivele", "g2_overview_eye": "Përmbledhje", "g2_overview_h2": "Përmbledhje e magazinës", "g2_overview_note": "Pamje skematike e rreshtave, korridoreve dhe zonave të veçanta.", "g2_occ_eye": "Zënia 2D", "g2_occ_h2": "Zënia sipas vendit", "g2_level": "Niveli", "g2_color": "Ngjyrosja", "g2_btn_occ": "Zënia", "g2_btn_customer": "Klienti
